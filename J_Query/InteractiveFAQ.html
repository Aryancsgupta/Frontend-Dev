<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive FAQ</title>

    <style>
        .faq-item {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #bbb;
        }

        .question {
            font-size: 18px;
            cursor: pointer;
        }

        .answer {
            display: none;
            margin-top: 10px;
            color: #444;
        }

        .highlight {
            background: #ffe8b3;
        }
    </style>
</head>
<body>

    <main>
        <h1>FAQ Section</h1>

        <!-- FAQ 1 -->
        <div class="faq-item">
            <div class="question">What is jQuery?</div>
            <div class="answer">
                jQuery is a JavaScript library that simplifies DOM handling.
                <br><br>
                <input type="text" class="answer-input" placeholder="Was this helpful?">
            </div>
        </div>

        <!-- FAQ 2 -->
        <div class="faq-item">
            <div class="question">How does AJAX work?</div>
            <div class="answer">
                AJAX allows asynchronous communication with a server.
                <br><br>
                <input type="text" class="answer-input" placeholder="Your feedback">
            </div>
        </div>

        <!-- FAQ 3 -->
        <div class="faq-item">
            <div class="question">Is jQuery still useful?</div>
            <div class="answer">
                Yes! Many websites still rely on it.
                <br><br>
                <input type="text" class="answer-input" placeholder="Your opinion">
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="InteractiveFAQ.js"></script>
</body>
</html>
