<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Highlight</title>
    <style>
        .product {
            border: 1px solid #ccc;
            padding: 15px;
            width: 180px;
            margin: 10px;
            display: inline-block;
            cursor: pointer;
            position: relative;
        }

        .highlight {
            background: #ffe9a8;
        }

        .selected {
            color: red;
        }

        /* Attribute Selector → products with discount */
        .product[data-discount="true"] {
            border-color: green;
        }

        .details {
            display: none;
            font-size: 14px;
            color: gray;
        }

        .fav {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main>
        <h1>Products</h1>

        <!-- Product 1 -->
        <div class="product" data-stock="10" data-discount="true">
            <span class="fav">★</span>
            <h3>Product A</h3>
            <p>Price: $50</p>
            <p class="details">High quality item.</p>
        </div>

        <!-- Product 2 -->
        <div class="product" data-stock="0" data-discount="false">
            <span class="fav">★</span>
            <h3>Product B</h3>
            <p>Price: $30</p>
            <p class="details">Limited edition.</p>
        </div>

        <!-- Product 3 -->
        <div class="product" data-stock="5" data-discount="true">
            <span class="fav">★</span>
            <h3>Product C</h3>
            <p>Price: $20</p>
            <p class="details">Special offer!</p>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="productHighlight.js"></script>
</body>
</html>
