<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offer Banner</title>

    <style>
        .banner {
            background: #ffe4b5;
            padding: 20px;
            margin: 10px 0;
            font-size: 20px;
            border: 2px solid #ff9800;
        }

        .controls button {
            margin-right: 10px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Special Offers</h1>
    </header>

    <section class="controls">
        <button id="hide">Hide</button>
        <button id="show">Show</button>
        <button id="slideToggle">Slide Up/Down</button>
        <button id="fadeToggle">Fade In/Out</button>
    </section>

    <main>
        <div class="banner">🔥 Buy 1 Get 1 Free!</div>
        <div class="banner">💥 30% off on Electronics!</div>
        <div class="banner">🎉 Special Offer on Clothing!</div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="specialOffer.js"></script>
</body>
</html>
