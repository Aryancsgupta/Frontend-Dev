<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Members Directory</title>

    <style>
        .department {
            background: #dfe6e9;
            padding: 15px;
            margin: 20px 0;
            border: 2px solid #636e72;
        }

        .employee {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #b2bec3;
            cursor: pointer;
        }

        .highlight {
            background: #ffeaa7 !important;
        }

        .contact {
            display: none;
            font-size: 14px;
            color: #555;
        }

        #randomBtn {
            padding: 8px 16px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <h1>Team Members Directory</h1>

    <button id="randomBtn">Highlight Siblings of Random Employee</button>

    <!-- Department 1 -->
    <div class="department" id="dept1">
        <h2 class="dept-title">Development Department</h2>

        <div class="manager employee" data-role="manager">Rahul (Manager)</div>
        <div class="employee">Amit (Dev)
            <div class="contact">Email: amit@example.com</div>
        </div>
        <div class="employee">Sneha (Dev)
            <div class="contact">Email: sneha@example.com</div>
        </div>
    </div>

    <!-- Department 2 -->
    <div class="department" id="dept2">
        <h2 class="dept-title">Design Department</h2>

        <div class="manager employee" data-role="manager">Karan (Manager)</div>
        <div class="employee">Priya (Designer)
            <div class="contact">Email: priya@example.com</div>
        </div>
        <div class="employee">Neha (Designer)
            <div class="contact">Email: neha@example.com</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="teamMembers.js"></script>
</body>
</html>
