<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>
    <div class="gallery">
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNkl44gUwSE-ZEWnqtQ--KTtlOolptop2CZg&s" alt="Image 1">
            <div class="caption">Image 1 Caption</div>
        </div>
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNkl44gUwSE-ZEWnqtQ--KTtlOolptop2CZg&s" alt="Image 2">
            <div class="caption">Image 2 Caption</div>
        </div>
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNkl44gUwSE-ZEWnqtQ--KTtlOolptop2CZg&s" alt="Image 3">
            <div class="caption">Image 3 Caption</div>
        </div>
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNkl44gUwSE-ZEWnqtQ--KTtlOolptop2CZg&s" alt="Image 4">
            <div class="caption">Image 4 Caption</div>
        </div>
        <div class="gallery-item">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNkl44gUwSE-ZEWnqtQ--KTtlOolptop2CZg&s" alt="Image 5">
            <div class="caption">Image 5 Caption</div>
        </div>
        <div class="gallery-item">
            <img src="ht1tps://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNkl44gUwSE-ZEWnqtQ--KTtlOolptop2CZg&s" alt="Image 6">
            <div class="caption">Image 6 Caption</div>
        </div>
    </div>
</body>
</html>
