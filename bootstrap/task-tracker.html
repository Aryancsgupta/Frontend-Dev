<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="task-tracker.css">
</head>
<body class="bg-light">

  <!-- ===== HEADER ===== -->
  <header class="bg-success text-white text-center py-4">
    <h1 class="fw-bold mb-0">Task Tracker</h1>
    <p class="mb-0">
      Pending Tasks 
      <span class="badge bg-warning text-dark">5</span>
    </p>
  </header>

  <!-- ===== MAIN SECTION ===== -->
  <main class="container my-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="fw-bold mb-4">Today's Tasks</h4>

        <!-- Task List -->
        <ul class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Finish Bootstrap Assignment
            <span class="badge bg-danger rounded-pill">High</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Prepare Java Notes
            <span class="badge bg-warning text-dark rounded-pill">Medium</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Update Database Report
            <span class="badge bg-danger rounded-pill">High</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Review Project Code
            <span class="badge bg-success rounded-pill">Low</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Check Internship Mail
            <span class="badge bg-success rounded-pill">Low</span>
          </li>
        </ul>

        <!-- Completed Button -->
        <div class="text-center mt-4">
          <button class="btn btn-primary">
            Completed 
            <span class="badge bg-light text-dark ms-1">2</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Task Tracker by Amit Kumar</p>
  </footer>

</body>
</html>
