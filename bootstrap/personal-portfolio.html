<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="personal-portfolio.css">
</head>
<body class="bg-light text-dark">

  <!-- ===== HEADER ===== -->
  <header class="text-center p-5 bg-primary text-white">
    <h1 class="fw-bold">Amit Kumar</h1>
    <p class="lead">Aspiring Web Developer & Java Enthusiast</p>
  </header>

  <!-- ===== MAIN SECTION ===== -->
  <main class="container text-center mt-4">
    <!-- Profile Image -->
    <img src="https://via.placeholder.com/150" alt="Profile" class="img-fluid rounded-circle mb-4">

    <!-- Buttons -->
    <div class="mb-4">
      <button class="btn btn-success me-3">Hire Me</button>
      <button class="btn btn-outline-primary">Download CV</button>
    </div>

    <!-- Contact Form -->
    <section class="bg-white p-5 shadow-sm rounded">
      <h3 class="mb-4 fw-bold">Contact Me</h3>
      <form>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="4" placeholder="Your Message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary px-4">Send Message</button>
      </form>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="text-center py-3 mt-5 bg-dark text-white">
    <p class="mb-0">&copy; 2025 Amit Kumar. All rights reserved.</p>
  </footer>

</body>
</html>
