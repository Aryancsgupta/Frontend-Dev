<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="product-catalog.css">
</head>
<body class="bg-light">

  <!-- ===== HEADER ===== -->
  <header class="text-center py-4 bg-dark text-white">
    <h1 class="fw-bold">Online Store</h1>
    <p class="lead mb-0">Browse our latest products</p>
  </header>

  <!-- ===== PRODUCT GRID ===== -->
  <main class="container my-5">
    <div class="row g-4"><!-- g-4 adds spacing between columns -->

      <!-- Product 1 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title fw-bold">Smart Watch</h5>
            <p class="card-text text-muted">$120</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title fw-bold">Wireless Headphones</h5>
            <p class="card-text text-muted">$80</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title fw-bold">Bluetooth Speaker</h5>
            <p class="card-text text-muted">$60</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title fw-bold">Gaming Mouse</h5>
            <p class="card-text text-muted">$40</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025 Online Store. All rights reserved.</p>
  </footer>

</body>
</html>
