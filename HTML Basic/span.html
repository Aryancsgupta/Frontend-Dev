<!DOCTYPE html>
<html>
<head>
    <title>Span Example</title>
    <style>
        .highlight { color: red; font-weight: bold; }
        .label { background-color: yellow; }
        .note { font-style: italic; color: green; }
    </style>
</head>
<body>
    <p>
        My favorite hobby is <span class="highlight">reading</span>, which helps me improve my knowledge. I also enjoy <span class="label">coding</span> because it allows me to create <span class="note">useful projects</span> and solve problems creatively.
    </p>
</body>
</html>
