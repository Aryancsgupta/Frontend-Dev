<!DOCTYPE html>
<html>
<head>
    <title>My Webpage with Navigation</title>
    <style>
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #f2f2f2;
            padding: 10px;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        nav a:hover {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Awesome Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <p>Welcome to my website! Here you will find information about my hobbies, projects, and more.</p>
</body>
</html>
